services:
  vehiclevault:
    image: ghcr.io/helmerznl/vehiclevault:${VEHICLEVAULT_TAG:-latest}
    # Uncomment 'build' below only if you cloned the full repository and want to build locally:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    # Name of the container (CONTAINER_NAME in .env). Delete this line to let Docker choose a name, which avoids
    # naming conflicts when Dockhand/Portainer recreate the container during an update.
    container_name: ${CONTAINER_NAME:-vehiclevault}
    restart: unless-stopped
    ports:
      # Host port : Container internal port. The beta branch defaults to host port 3085 so it can run next to the
      # stable stack (3084); set PORT in .env to change it. The container always listens on 3084.
      - "${PORT:-3085}:3084"
    environment:
      - NODE_ENV=production
      - PORT=3084
      - DATA_DIR=/data
      - VEHICLEVAULT_TAG=${VEHICLEVAULT_TAG:-latest}
      # Optional, for passkeys behind a reverse proxy (see docs/wiki/Notifications-and-Security.md)
      - RP_ID=${RP_ID:-}
      - RP_ORIGINS=${RP_ORIGINS:-}
      - JWT_SECRET=${JWT_SECRET:-change_this_to_a_random_secure_secret_in_production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change_this_to_another_random_secure_secret}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3084/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
